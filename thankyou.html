<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1abc9c, #3498db);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        /* Element Dimension & Text Flow control */
        .thankyou-card {
            background: white;
            width: 90%;
            max-width: 500px; /* Dimension Limiting */
            padding: 40px;
            text-align: center;
            border-radius: 15px; /* Rounded corners */
            box-shadow: 0 10px 30px rgba(0,0,0,0.25); /* Box Shadows */
            position: relative;
        }

        /* Text Shadows & Styling */
        h1 {
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.15);
        }

        p {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.5; /* Text flow adjustments */
        }

        .back-home {
            display: inline-block;
            text-decoration: none;
            background-color: #3498db;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.4);
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        /* Decorative Positioned element */
        .badge {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: #f1c40f;
            color: #2c3e50;
            padding: 5px 15px;
            font-weight: bold;
            border-radius: 10px;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="thankyou-card">
        <!-- Positioned Item Element -->
        <div class="badge">SUCCESS</div>
        
        <h1>Thank You!</h1>
        <p>Your registration and course feedback processing details have been received successfully. Welcome to our web developer platform community track!</p>
        
        <a href="index.html" class="back-home">Back to Portal Home</a>
    </div>

</body>
</html>
